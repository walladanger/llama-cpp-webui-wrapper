[package]
name = "llama-webui-shell"
version = "0.1.0"
edition = "2021"
description = "Windows desktop shell for the bundled llama.cpp web UI"
publish = false

[[bin]]
name = "llama-webui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
