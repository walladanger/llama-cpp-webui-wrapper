[package]
name = "llama-webui-shell"
version = "0.1.3"
edition = "2021"
description = "Windows desktop shell for the bundled llama.cpp web UI"
publish = false

[[bin]]
name = "llama-webui"
path = "src/main.rs"

[[bin]]
name = "llama-engine-manager"
path = "src/bin/llama-engine-manager.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
rfd = { version = "0.15.4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
