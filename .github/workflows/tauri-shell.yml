name: Tauri shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tauri-shell/**', '.github/workflows/tauri-shell.yml']
  pull_request:
    paths: ['tauri-shell/**', '.github/workflows/tauri-shell.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-shell
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v6
        with:
          name: llama-webui-windows-x64
          path: tauri-shell/target/release/llama-webui.exe
          if-no-files-found: error
